<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Viabilidad - CDMX</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }

        .mapa {
            width: 1000px;
            height: 1000px;
            max-width: 100%;
            background-color: #e0e0e0;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        .leaflet-popup-content {
            font-size: 14px;
            line-height: 1.5;
        }

        .popup-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
            border-bottom: 1px solid #ccc;
            padding-bottom: 3px;
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        .btn.active {
            background-color: #28a745;
        }
    </style>
</head>

<body>

    <h1>Viabilidad para Estaciones de Carga - CDMX</h1>

    <div class="controls">
        <button id="btn-original" class="btn active">Modelo Original (Con Destinos)</button>
        <button id="btn-no-destinos" class="btn">Modelo sin Destinos</button>
        <button id="btn-2030" class="btn">Predicción 2030</button>
        <button id="btn-2035" class="btn">Predicción 2035</button>
    </div>

    <!-- Contenedor del mapa -->
    <div id="map" class="mapa"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        // Coordenadas centrales de CDMX
        const map = L.map('map').setView([19.38, -99.15], 11);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // ---------- Utilidades ----------
        function getColor(viabilidad) {
            if (viabilidad > 0.8) {
                return '#2ca25f'; // Verde (alta)
            } else if (viabilidad > 0.4) {
                return '#ffeda0'; // Amarillo (media)
            } else {
                return '#de2d26'; // Rojo (baja)
            }
        }

        function style(feature) {
            return {
                fillColor: getColor(feature.properties.viabilidad),
                weight: 1,
                opacity: 1,
                color: 'white',
                fillOpacity: 0.7
            };
        }

        const btnIds = ['btn-original', 'btn-no-destinos', 'btn-2030', 'btn-2035'];

        function setActive(id) {
            btnIds.forEach(b => document.getElementById(b).classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // ---------- Mapas de viabilidad (originales) ----------
        let isSinDestinosMap = false;
        let currentLayer = null;

        function onEachFeature(feature, layer) {
            if (feature.properties) {
                const props = feature.properties;
                const alcaldia = props.NOM_MUN || 'Desconocida';
                const viviendasAuto = props.VPH_AUTOM !== null ? props.VPH_AUTOM : 'N/D';
                const viabilidad = (props.viabilidad !== null && props.viabilidad !== undefined)
                    ? props.viabilidad.toFixed(4) : 'N/D';

                let popupContent = `
                    <div class="popup-title">Alcaldía: ${alcaldia}</div>
                    <div><b>Viviendas con auto:</b> ${viviendasAuto}</div>
                `;

                if (!isSinDestinosMap) {
                    const destinos = props.destinos_raw !== null ? props.destinos_raw : 'N/D';
                    popupContent += `<div><b>Destinos contados:</b> ${destinos}</div>`;
                }

                popupContent += `<div><b>Puntaje de viabilidad:</b> ${viabilidad}</div>`;

                layer.bindPopup(popupContent);
            }
        }

        function loadMapData(filename) {
            if (currentLayer) {
                map.removeLayer(currentLayer);
            }
            fetch(filename)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Error al cargar el archivo GeoJSON');
                    }
                    return response.json();
                })
                .then(data => {
                    currentLayer = L.geoJSON(data, {
                        style: style,
                        onEachFeature: onEachFeature
                    }).addTo(map);
                })
                .catch(error => {
                    console.error('Hubo un problema con la petición Fetch:', error);
                });
        }

        // ---------- Predicciones 2030 / 2035 (modelo) ----------
        let PRED = [];

        // Se carga una sola vez; la llave "zona" == CVEGEO del polígono
        fetch('./predicciones.json')
            .then(r => r.json())
            .then(d => { PRED = d; })
            .catch(e => console.error('No se pudo cargar predicciones.json:', e));

        const mxn = n => '$' + Math.round(n).toLocaleString('es-MX');

        function loadPrediction(año) {
            if (currentLayer) {
                map.removeLayer(currentLayer);
            }

            // Índice rápido: CVEGEO -> predicción de ese año
            const porZona = {};
            PRED.filter(r => r['año'] === año).forEach(r => { porZona[r.zona] = r; });

            fetch('./viabilidad_cdmx_v2.geojson')
                .then(r => r.json())
                .then(geo => {
                    currentLayer = L.geoJSON(geo, {
                        style: f => {
                            const p = porZona[f.properties.CVEGEO];
                            return {
                                fillColor: getColor(p ? p.score_viabilidad : 0),
                                weight: 1,
                                opacity: 1,
                                color: 'white',
                                fillOpacity: 0.7
                            };
                        },
                        onEachFeature: (f, layer) => {
                            const p = porZona[f.properties.CVEGEO];
                            if (!p) return;
                            layer.bindPopup(`
                                <div class="popup-title">${p.alcaldia} — ${año}</div>
                                <div><b>Ganancia máx:</b> ${mxn(p.ganancia_max)}</div>
                                <div><b>Ganancia mín:</b> ${mxn(p.ganancia_min)}</div>
                                <div><b>Score:</b> ${p.score_viabilidad.toFixed(3)}</div>
                            `);
                        }
                    }).addTo(map);
                })
                .catch(e => console.error('Error al cargar el GeoJSON:', e));
        }

        // ---------- Botones ----------
        document.getElementById('btn-original').addEventListener('click', function () {
            setActive('btn-original');
            isSinDestinosMap = false;
            loadMapData('./viabilidad_cdmx_v2.geojson');
        });

        document.getElementById('btn-no-destinos').addEventListener('click', function () {
            setActive('btn-no-destinos');
            isSinDestinosMap = true;
            loadMapData('./viabilidad_cdmx_v2_no_destinos.geojson');
        });

        document.getElementById('btn-2030').addEventListener('click', function () {
            setActive('btn-2030');
            loadPrediction(2030);
        });

        document.getElementById('btn-2035').addEventListener('click', function () {
            setActive('btn-2035');
            loadPrediction(2035);
        });

        // Mapa por defecto
        loadMapData('./viabilidad_cdmx_v2.geojson');
    </script>
</body>

</html>
