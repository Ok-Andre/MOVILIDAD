<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viabilidad para Estaciones de Carga - CDMX</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>

    <h1>Viabilidad para Estaciones de Carga - CDMX</h1>

    <div class="controls">
        <button id="btn-original" class="btn active">Modelo Original (Con Destinos)</button>
        <button id="btn-no-destinos" class="btn">Modelo sin Destinos</button>
    </div>

    <!-- Contenedor del mapa -->
    <div id="map" class="mapa"></div>

    <!-- Gráficas abajo del mapa -->
    <div class="charts-container">
        <div class="chart-box">
            <h2>Viabilidad Promedio por Alcaldía</h2>
            <div class="chart-wrapper">
                <canvas id="chart-alcaldia"></canvas>
            </div>
        </div>

        <div class="charts-row">
            <div class="chart-box">
                <h2>Electrolineras por Red</h2>
                <div class="chart-wrapper">
                    <canvas id="chart-chargers"></canvas>
                </div>
            </div>

            <div class="chart-box">
                <h2>Desglose de Componentes del Modelo</h2>
                <div class="chart-wrapper">
                    <canvas id="chart-components"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts Leaflet, MarkerCluster, Chart.js y Lógica -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="assets/js/main.js"></script>
</body>

</html>
